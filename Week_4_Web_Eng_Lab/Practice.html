<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      display: flex;              
      flex-direction: row;        
      justify-content: flex-start;
      align-items: flex-start;    
      gap: 15px;                  
      border: 2px solid #333;
      padding: 15px;
      min-height: 150px;         
    }

    .box {
      width: 100px;
      height: 80px;
      background: #c57916dc;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>

</body>
</html>
